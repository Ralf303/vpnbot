services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vpnbot_test
      POSTGRES_USER: vpnbot
      POSTGRES_PASSWORD: vpnbot_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnbot -d vpnbot_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
